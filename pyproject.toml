[project]
name = "cd-music-cap"
version = "0.1.0"
description = "LALM Contrastive Decoding Error Profiles"
requires-python = "==3.11.*"
dependencies = [
    "vllm==0.10.2",
    "datasets==3.6.0",
    "scikit-learn",
    "accelerate",
    "librosa",
    "transformers>=5.0.0",
    "openai",
    "python-dotenv",
    "soundfile",
    "pyyaml",
    "tqdm",
    "scipy",
    "matplotlib>=3.11.1",
    "jiwer",
    "spacy",
    "desta",
    "aac-metrics>=0.5.4,<0.6.0",
    "wandb",
]

[tool.uv]
package = false
override-dependencies = [
    "huggingface-hub>=1.3.0",
]

[tool.uv.sources]
desta = { path = "../DeSTA2.5-Audio", editable = true }
